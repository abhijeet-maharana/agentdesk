# agentdesk + Postgres. Put your secrets in .env (see .env.example) and your config in
# agentdesk.config.yaml, then: docker compose up -d
services:
  agentdesk:
    build: .
    restart: unless-stopped
    # Time to finish replies being written before the container stops (agentdesk waits up to 25 s).
    stop_grace_period: 30s
    ports: ["8080:8080"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://agentdesk:agentdesk@db:5432/agentdesk
    volumes:
      - ./agentdesk.config.yaml:/app/agentdesk.config.yaml:ro
      # - ./prompt.md:/app/prompt.md:ro
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: agentdesk
      POSTGRES_PASSWORD: agentdesk
      POSTGRES_DB: agentdesk
    volumes: [db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentdesk"]
      interval: 5s
      retries: 10

volumes:
  db:
