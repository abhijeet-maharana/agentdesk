# On every push to main: tests, then the next version from the commit messages since the last
# tag (feat!/BREAKING CHANGE → major, feat → minor, anything else → patch), the image pushed to
# ghcr.io/<owner>/agentdesk as latest, <version> and <sha>, and a GitHub release vX.Y.Z with notes.
name: Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# One release at a time, so two quick pushes can't pick the same version.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # the release and its tag
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # all commits and tags, to work out the next version
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck && npm run lint && npm test

      - id: version
        if: github.ref == 'refs/heads/main'
        run: |
          last=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)
          subjects=$(git log --format='%s%n%b' ${last:+$last..}HEAD)
          IFS=. read -r major minor patch <<< "${last#v}"
          major=${major:-0}; minor=${minor:-0}; patch=${patch:-0}
          if grep -qE '^[a-z]+(\(.+\))?!:|^BREAKING CHANGE' <<< "$subjects"; then
            major=$((major + 1)); minor=0; patch=0
          elif grep -qE '^feat(\(.+\))?:' <<< "$subjects"; then
            minor=$((minor + 1)); patch=0
          else
            patch=$((patch + 1))
          fi
          echo "version=$major.$minor.$patch" >> "$GITHUB_OUTPUT"
          echo "Last release: ${last:-none}. Next: v$major.$minor.$patch"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/agentdesk
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ steps.version.outputs.version != '' }}
            type=semver,pattern={{version}}
            type=sha,format=short
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: GitHub release
        if: steps.version.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ steps.version.outputs.version }}" --target "$GITHUB_SHA" --generate-notes
